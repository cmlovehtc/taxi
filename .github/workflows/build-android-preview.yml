name: Build Android APK preview

on:
  push:
    branches: [codex/android-apk-preview]
    paths: ['android-app/**', '.github/workflows/build-android-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Preserve test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/taxi-preview.keystore
          key: taxi-android-preview-signing-v1
      - name: Build native APK and test question logic
        run: bash android-app/build.sh
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-android-apk
          path: |
            android-app/build/taxi-exam-0.2.0.apk
            android-app/build/*report.txt
            android-app/build/SHA256SUMS.txt
          retention-days: 30
      - name: Get original APK for installation update test
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: taxi-android-apk
          path: android-app/build/previous
          github-token: ${{ github.token }}
          repository: cmlovehtc/taxi
          run-id: 34623732070
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify city selection, custom ratios and study screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android-app/tests/smoke.py --remaining-ui
      - name: Save emulator screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-android-device-check
          path: android-app/build/device-check/
          if-no-files-found: ignore
          retention-days: 30
