name: Windows 電腦自動更新官方題庫

on:
  schedule:
    # 每天台灣時間 04:20 檢查一次，避開一般使用尖峰。
    - cron: "20 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-question-bank
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'cmlovehtc/taxi'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_CACHE_DIR: "C:\\actions-runner\\_pip_cache"
    steps:
      - name: 準備免安裝版 Git
        shell: cmd
        env:
          TAXI_GIT_HOME: "C:\\actions-runner\\tools\\mingit-2.55.0.5"
          TAXI_GIT_ZIP: "C:\\actions-runner\\downloads\\MinGit-2.55.0.5-64-bit.zip"
          TAXI_GIT_URL: "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"
          TAXI_GIT_SHA256: "56D7B226B7693196CFC71FEF26568F536C4A021AB6C37FF2DB4287BED908E96E"
        run: |
          if not exist "%TAXI_GIT_HOME%\cmd\git.exe" (
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ProgressPreference='SilentlyContinue'; New-Item -ItemType Directory -Path (Split-Path -Parent $env:TAXI_GIT_ZIP) -Force | Out-Null; Invoke-WebRequest -UseBasicParsing -Uri $env:TAXI_GIT_URL -OutFile $env:TAXI_GIT_ZIP; $actual=(Get-FileHash -LiteralPath $env:TAXI_GIT_ZIP -Algorithm SHA256).Hash; if($actual -ne $env:TAXI_GIT_SHA256){throw 'Portable Git failed its SHA-256 security check.'}; New-Item -ItemType Directory -Path $env:TAXI_GIT_HOME -Force | Out-Null; Expand-Archive -LiteralPath $env:TAXI_GIT_ZIP -DestinationPath $env:TAXI_GIT_HOME -Force"
            if errorlevel 1 exit /b 1
          )
          echo %TAXI_GIT_HOME%\cmd>>"%GITHUB_PATH%"
          "%TAXI_GIT_HOME%\cmd\git.exe" --version
          if errorlevel 1 exit /b 1

      - name: 取得網站原始碼
        uses: actions/checkout@v7
        with:
          clean: true

      - name: 檢查本機 Python
        shell: cmd
        run: |
          "C:\Python312\python.exe" --version
          if errorlevel 1 exit /b 1

      - name: 建立獨立環境並安裝題庫工具
        shell: cmd
        run: |
          "C:\Python312\python.exe" -m venv .venv
          if errorlevel 1 exit /b 1
          ".venv\Scripts\python.exe" -m pip install -r tools\requirements.txt
          if errorlevel 1 exit /b 1

      - name: 從警政署下載並驗證題庫
        shell: cmd
        run: |
          ".venv\Scripts\python.exe" tools\update_question_bank.py
          if errorlevel 1 exit /b 1

      - name: 提交有變更的題庫
        shell: cmd
        run: |
          for %%F in (*.txt) do git add -- "%%F"
          if errorlevel 1 exit /b 1
          git add -- "index.html" "question-bank-manifest.json" || exit /b 1
          git diff --cached --quiet
          if errorlevel 2 exit /b %ERRORLEVEL%
          if not errorlevel 1 (
            echo Official question bank has no changes.
            exit /b 0
          )
          git config user.name "taxi-question-bank-bot" || exit /b 1
          git config user.email "taxi-question-bank-bot@users.noreply.github.com" || exit /b 1
          git commit -m "Auto-update official question bank" || exit /b 1
          git push origin "HEAD:main"
