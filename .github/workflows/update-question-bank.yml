name: 自動更新官方題庫

on:
  schedule:
    # 每天台灣時間 04:20 檢查一次，避開一般使用尖峰。
    - cron: "20 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-question-bank.yml"
      - "tools/update_question_bank.py"
      - "tools/requirements.txt"

permissions:
  contents: write

concurrency:
  group: update-question-bank
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v7

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: 安裝題庫處理工具
        run: pip install -r tools/requirements.txt

      - name: 從警政署下載並驗證題庫
        run: python tools/update_question_bank.py

      - name: 提交有變更的題庫
        run: |
          if git diff --quiet; then
            echo "官方題庫沒有變更"
            exit 0
          fi
          git config user.name "taxi-question-bank-bot"
          git config user.email "taxi-question-bank-bot@users.noreply.github.com"
          git add -- '*.txt' index.html question-bank-manifest.json
          git commit -m "自動更新官方題庫"
          git push
